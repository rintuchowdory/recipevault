name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Test Backend ──────────────────────────────────────────────────────────────
  test-backend:
    name: Test Python API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Check syntax
        run: python -m py_compile main.py
        working-directory: backend
      - name: Check API starts
        run: |
          mkdir -p /tmp/data
          DB_PATH=/tmp/data/recipes.db python -c "
          import os; os.environ.setdefault('DB_PATH','/tmp/data/recipes.db')
          import ast, sys
          with open('main.py') as f: ast.parse(f.read())
          print('✅ main.py syntax OK')
          "
        working-directory: backend

  # ── Build Docker Images ───────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t recipevault-backend ./backend
      - name: Build frontend
        run: docker build -t recipevault-frontend ./frontend

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Notice
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Done
        run: echo "✅ All checks passed — ready to deploy!"
