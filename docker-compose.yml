version: '3.9'

services:

  # ── Python FastAPI Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recipevault-backend
    restart: unless-stopped
    volumes:
      - recipe-data:/data          # Persist SQLite database
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React + Vite Frontend (served by Nginx) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recipevault-frontend
    restart: unless-stopped
    ports:
      - "3000:80"                  # Access app at localhost:3000
    depends_on:
      - backend
    networks:
      - app-network

# ── Persistent volume for database ───────────────────────────────────────────
volumes:
  recipe-data:

# ── Internal network ──────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
